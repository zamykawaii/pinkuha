[project]
name = "pinkuha"
version = "0.1.0"
description = "Download, deduplicate, and organize Pinterest boards."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Zamy Kawaii", email = "zadkiel.art1@gmail.com" }]
keywords = ["pinterest", "downloader", "cli", "images"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "gallery-dl>=1.32.9",
    "pillow>=11.0.0",
    "typer>=0.27.0",
]

[project.scripts]
pinkuha = "pinkuha.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinkuha"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
