name: Version Check

on:
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          CHANGELOG_VERSION=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "pyproject.toml: $PYPROJECT_VERSION"
          echo "CHANGELOG.md: $CHANGELOG_VERSION"
          if [ "$PYPROJECT_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml has $PYPROJECT_VERSION, CHANGELOG.md has $CHANGELOG_VERSION"
            exit 1
          fi
